[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exercise-tracker"
version = "0.1.0"
description = "Pose-trajectory based rep counter and form checker for exercises"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "mediapipe>=0.10.0",
    "opencv-python>=4.5.0",
    "fire>=0.5.0",
    "pyyaml>=6.0",
    "scipy>=1.7.0",
    "joblib>=1.0.0",
    "matplotlib>=3.5.0",
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

